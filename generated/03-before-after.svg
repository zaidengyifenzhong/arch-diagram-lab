<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">AsterSim | Before / after decomposition</title><desc id="desc">Which responsibility changes when scheduling policy becomes a separate module? The proposal isolates policy; it does not claim a measured speedup. SIMPLIFIED SYNTHETIC TEACHING EXAMPLE · NOT A RESEARCH TEMPLATE</desc>
<defs>
<marker id="arrow-data" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#245a81"/></marker>
<marker id="arrow-control" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#7b4e90"/></marker>
<marker id="arrow-feedback" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#a15a28"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#182a3a">
<text x="40" y="48" font-size="28" font-weight="700">AsterSim | Before / after decomposition</text>
<text x="40" y="82" font-size="17" fill="#526271">Which responsibility changes when scheduling policy becomes a separate module?</text>
<text x="40" y="112" font-size="13" letter-spacing="1" fill="#697582">SIMPLIFIED SYNTHETIC TEACHING EXAMPLE · NOT A RESEARCH TEMPLATE</text>
<rect x="40" y="155" width="520" height="395" rx="12" fill="#f7f9fc" stroke="#d5dde6"/>
<text x="58" y="185" font-size="17" font-weight="700">BEFORE · Responsibilities coupled</text>
<rect x="620" y="155" width="540" height="395" rx="12" fill="#f7f9fc" stroke="#d5dde6"/>
<text x="638" y="185" font-size="17" font-weight="700">AFTER · Policy made explicit</text>
<g id="edge-before"><title>bin → mono (data)</title><path d="M 205,301.0 L 275,301.0" fill="none" stroke="#245a81" stroke-width="2.4" stroke-dasharray="" marker-end="url(#arrow-data)"/></g>
<g id="edge-after"><title>ain → exec (data)</title><path d="M 795,301.0 L 885,301.0" fill="none" stroke="#245a81" stroke-width="2.4" stroke-dasharray="" marker-end="url(#arrow-data)"/></g>
<g id="edge-control"><title>policy → exec (control)</title><path d="M 995.0,425 L 995.0,357" fill="none" stroke="#7b4e90" stroke-width="2.4" stroke-dasharray="7 4" marker-end="url(#arrow-control)"/></g>
